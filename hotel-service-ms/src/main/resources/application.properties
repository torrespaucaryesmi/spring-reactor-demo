spring.application.name=hotel-app
spring.webflux.base-path=/app-hotel
server.port=9001

spring.r2dbc.url=r2dbc:mysql://root:mypassword@localhost/hotel_db
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.max-size=15
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-idle-time=10m
spring.r2dbc.pool.max-life-time=30m

spring.main.web-application-type=reactive
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:DML.sql


api.internal.nationalize.url=http://127.0.0.1:8080

logging.level.io.r2dbc.spi=TRACE
logging.level.io.asyncer.r2dbc.mysql=TRACE